# Render blueprint. Zero dependencies, so there is no build step beyond a no-op.
# Render's free disk is ephemeral, so the synthetic demo corpus is reseeded on every boot.
services:
  - type: web
    name: samanvay
    runtime: python
    plan: free
    buildCommand: "python --version"
    startCommand: "python scripts/reset_demo.py && python -m samanvay.server --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
